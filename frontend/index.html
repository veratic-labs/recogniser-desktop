<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>recogniser</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button class="brand" id="brand-button" type="button" aria-label="Go to the welcome screen">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">recogniser</span>
      </button>

      <div class="menu-root" id="settings-root">
        <button class="icon-button" id="settings-button" type="button"
                aria-haspopup="menu" aria-expanded="false" aria-controls="settings-menu"
                aria-label="Appearance settings" title="Appearance">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none"
               stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="10" cy="10" r="2.5"></circle>
            <path d="M10 2.5v1.6M10 15.9v1.6M2.5 10h1.6M15.9 10h1.6M4.7 4.7l1.1 1.1M14.2 14.2l1.1 1.1M15.3 4.7l-1.1 1.1M5.8 14.2l-1.1 1.1"></path>
          </svg>
        </button>
        <div class="menu" id="settings-menu" role="menu"
             aria-labelledby="settings-button" hidden>
          <p class="menu-heading" role="presentation">Appearance</p>
          <div id="theme-options" role="group" aria-label="Appearance theme"></div>
        </div>
      </div>
    </header>

    <main class="main">
      <noscript>
        <p class="noscript">recogniser needs JavaScript to display its interface.</p>
      </noscript>

      <section class="welcome" id="welcome-view" aria-labelledby="welcome-title">
        <div class="welcome-intro">
          <p class="eyebrow">Welcome</p>
          <h1 id="welcome-title">Welcome to recogniser</h1>
          <p class="lede">
            A small desktop app for trying trained neural networks on your own
            input. Choose a category below to get started.
          </p>
        </div>

        <section class="category-section" aria-labelledby="categories-title">
          <div class="section-heading">
            <h2 id="categories-title">Select a category</h2>
            <span class="count" id="category-count"></span>
          </div>
          <div class="category-list" id="category-list" aria-live="polite">
            <p class="placeholder">Loading categories…</p>
          </div>
        </section>
      </section>

      <section class="category-view" id="category-view" aria-labelledby="category-title" hidden>
        <button class="back-button" id="back-button" type="button">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none"
               stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M10 3.5 5.5 8l4.5 4.5"></path>
          </svg>
          Back to categories
        </button>

        <div class="category-header">
          <h1 id="category-title"></h1>
          <p class="category-guidance" id="category-guidance"></p>
        </div>

        <div class="panel">
          <p class="model-description" id="model-description"></p>
          <p class="model-instructions" id="model-instructions"></p>
          <div class="mode-tabs" id="mode-tabs" role="tablist" aria-label="Input mode"></div>
          <div class="mode-panel" id="mode-panel" role="tabpanel"></div>
          <div class="result" id="result-area" role="group" aria-label="Prediction result" hidden></div>
          <div class="panel-footer">
            <p class="panel-hint" id="mode-hint"></p>
            <div class="panel-footer-actions">
              <div class="model-picker">
                <label class="model-picker-label" for="model-select">Model</label>
                <select class="model-select" id="model-select"></select>
              </div>
              <button class="button primary" id="recognise-button" type="button" disabled>
                Recognise
              </button>
            </div>
          </div>
          <p class="status" id="status-message" role="status" data-tone="info"></p>
        </div>
      </section>
    </main>
  </div>

  <script src="js/bridge.js"></script>
  <script src="js/settings.js"></script>
  <script src="categories/numbers.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
